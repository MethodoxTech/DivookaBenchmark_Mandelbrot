<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mandelbrot Benchmark</title>
  <style>
    body {
      font-family: monospace;
      white-space: pre-wrap;
      padding: 16px;
    }
  </style>
</head>
<body>
<script>
(function () {
  function mandelbrot(width, height, maxIter) {
    const buffer = new Int32Array(width * height);
    let checksum = 0;

    const xMin = -2.0;
    const xMax = 1.0;
    const yMin = -1.5;
    const yMax = 1.5;

    const dx = (xMax - xMin) / (width - 1);
    const dy = (yMax - yMin) / (height - 1);

    let index = 0;
    for (let y = 0; y < height; y++) {
      const cy = yMin + y * dy;
      for (let x = 0; x < width; x++) {
        const cx = xMin + x * dx;

        let zx = 0.0;
        let zy = 0.0;
        let iter = 0;

        while (zx * zx + zy * zy <= 4.0 && iter < maxIter) {
          const zx2 = zx * zx - zy * zy + cx;
          zy = 2.0 * zx * zy + cy;
          zx = zx2;
          iter++;
        }

        buffer[index++] = iter;
        checksum += iter;
      }
    }

    return checksum;
  }

  function parseParams() {
    const params = new URLSearchParams(window.location.search);
    const width = parseInt(params.get("w") || "2000", 10);
    const height = parseInt(params.get("h") || "2000", 10);
    const maxIter = parseInt(params.get("i") || "1000", 10);
    return { width, height, maxIter };
  }

  function print(text) {
    document.body.textContent += text + "\n";
  }

  const { width, height, maxIter } = parseParams();
  const checksum = mandelbrot(width, height, maxIter);

  print("width=" + width);
  print("height=" + height);
  print("maxIter=" + maxIter);
  print("checksum=" + checksum);
})();
</script>
</body>
</html>
