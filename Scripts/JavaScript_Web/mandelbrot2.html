<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mandelbrot Benchmark</title>
  <style>
    body {
      font-family: monospace;
      white-space: pre-wrap;
      padding: 16px;
    }
  </style>
</head>
<body>
<script>
(function () {
  function mandelbrot(width, height, maxIter) {
    const buffer = new Int32Array(width * height);
    let checksum = 0;

    const xMin = -2.0;
    const xMax = 1.0;
    const yMin = -1.5;
    const yMax = 1.5;

    const dx = (xMax - xMin) / (width - 1);
    const dy = (yMax - yMin) / (height - 1);

    let index = 0;
    for (let y = 0; y < height; y++) {
      const cy = yMin + y * dy;
      for (let x = 0; x < width; x++) {
        const cx = xMin + x * dx;

        let zx = 0.0;
        let zy = 0.0;
        let iter = 0;

        while (zx * zx + zy * zy <= 4.0 && iter < maxIter) {
          const zx2 = zx * zx - zy * zy + cx;
          zy = 2.0 * zx * zy + cy;
          zx = zx2;
          iter++;
        }

        buffer[index++] = iter;
        checksum += iter;
      }
    }

    return checksum;
  }

  function parseParams() {
    const params = new URLSearchParams(window.location.search);
    return {
      width: parseInt(params.get("w") || "2000", 10),
      height: parseInt(params.get("h") || "2000", 10),
      maxIter: parseInt(params.get("i") || "1000", 10),
      warmup: (params.get("warmup") || "1") === "1"
    };
  }

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + " KB";
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + " MB";
    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
  }

  function print(text) {
    document.body.textContent += text + "\n";
  }

  const { width, height, maxIter, warmup } = parseParams();

  // Warmup (important for JIT)
  if (warmup) {
    mandelbrot(200, 200, 100);
  }

  // Memory before (if available)
  let memBefore = null;
  if (performance.memory) {
    memBefore = performance.memory.usedJSHeapSize;
  }

  const t0 = performance.now();
  const checksum = mandelbrot(width, height, maxIter);
  const t1 = performance.now();

  // Memory after
  let memAfter = null;
  if (performance.memory) {
    memAfter = performance.memory.usedJSHeapSize;
  }

  print("width=" + width);
  print("height=" + height);
  print("maxIter=" + maxIter);
  print("checksum=" + checksum);
  print("time_ms=" + (t1 - t0).toFixed(2));

  if (memBefore !== null && memAfter !== null) {
    print("memory_before=" + formatBytes(memBefore));
    print("memory_after=" + formatBytes(memAfter));
    print("memory_delta=" + formatBytes(memAfter - memBefore));
  } else {
    print("memory=unavailable (not supported in this browser)");
  }
})();
</script>
</body>
</html>
